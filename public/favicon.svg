<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232F3E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="50%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#EC7211"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="url(#cloudGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Stylized Cloud -->
  <path d="M46 36a9 9 0 0 0-1.8-17.8A14 14 0 0 0 18 24.5a10 10 0 0 0 2 19.5h26a9 9 0 0 0 0-18z" 
        fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- AWS Orange Dynamic Accent / Arrow Smile -->
  <path d="M21 44c8 5 18 5 24-2" 
        fill="none" stroke="url(#orangeGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="45,39 48,43 43,44" fill="#FF9900"/>
</svg>
